name: Extract remaining CJK app names
on:
  push:
    paths:
      - ".github/workflows/extract-cjk-names.yml"
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python tools/extract_cjk_names.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cjk_names.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Extract remaining CJK app names"
            git push origin main
          fi
