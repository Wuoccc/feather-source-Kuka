name: QA normalized app names
on:
  push:
    paths:
      - ".github/workflows/qa-normalized-names.yml"
      - "apps.json"
permissions:
  contents: write
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python tools/qa_normalized_names.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add name_qa.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "QA normalized app names"
            git pull --rebase origin main
            git push origin main
          fi
