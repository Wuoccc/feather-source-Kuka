name: Rebuild app names from Apple

on:
  push:
    paths:
      - ".github/workflows/rebuild-app-names.yml"

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: pip install pillow
      - name: Normalize names
        run: python tools/rebuild_app_names.py
      - name: Validate and commit
        run: |
          python - <<'PY'
          import json
          with open("apps.json","r",encoding="utf-8") as f:d=json.load(f)
          assert isinstance(d.get("apps"),list) and len(d["apps"])>0
          for a in d["apps"]:
              assert a.get("name")
          print("apps",len(d["apps"]))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps.json .name-normalization-summary.json
          git commit -m "Rebuild app names from verified Apple matches"
          git push origin main
