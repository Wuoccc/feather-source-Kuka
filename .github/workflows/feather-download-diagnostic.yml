name: Feather download URL diagnostic

on:
  push:
    paths:
      - ".github/workflows/feather-download-diagnostic.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect Kuka live lock state
        run: |
          python - <<'PY'
          import json, urllib.request, collections
          url="https://app.ioskuka.com/appstore"
          req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0"})
          with urllib.request.urlopen(req,timeout=30) as r:
              d=json.loads(r.read())
          apps=[a for a in d.get("apps",[]) if a.get("name")!="‼️公告内容‼️"]
          locks=collections.Counter(str(a.get("lock")) for a in apps)
          with_url=[a for a in apps if str(a.get("downloadURL") or "").strip()]
          locked_with_url=[a for a in with_url if str(a.get("lock"))=="1"]
          unlocked_no_url=[a for a in apps if str(a.get("lock"))!="1" and not str(a.get("downloadURL") or "").strip()]
          print("APPS",len(apps))
          print("LOCKS",dict(locks))
          print("WITH_DOWNLOAD_URL",len(with_url))
          print("LOCKED_WITH_URL",len(locked_with_url))
          print("UNLOCKED_NO_URL",len(unlocked_no_url))
          print("ROOT_UNLOCK_URL",d.get("unlockURL"))
          print("ROOT_PAY_URL",d.get("payURL"))
          print("URL_SAMPLES",[(a.get("name"),a.get("lock"),a.get("downloadURL")) for a in with_url[:10]])
          PY
