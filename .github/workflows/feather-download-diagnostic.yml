name: Feather download URL diagnostic

on:
  push:
    paths:
      - ".github/workflows/feather-download-diagnostic.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect Kuka package response bodies
        run: |
          python - <<'PY'
          import json, urllib.request, re
          source="https://raw.githubusercontent.com/Wuoccc/feather-source-Kuka/refs/heads/main/apps.json"
          with urllib.request.urlopen(urllib.request.Request(source,headers={"User-Agent":"Mozilla/5.0"}),timeout=30) as r:
              d=json.loads(r.read())
          tested=0
          for a in d.get("apps",[]):
              u=str(a.get("downloadURL") or "").strip()
              if not u or not re.search(r"\.(ipa|tipa)(?:$|[?#])",u,re.I):
                  continue
              try:
                  q=urllib.request.Request(u,headers={"User-Agent":"Mozilla/5.0","Range":"bytes=0-511"})
                  with urllib.request.urlopen(q,timeout=20) as r:
                      body=r.read(512)
                      print("APP",a.get("name"))
                      print("STATUS",r.status,"TYPE",r.headers.get("content-type"),"LEN",r.headers.get("content-length"))
                      print("BODY",body.decode("utf-8","replace").replace("\n"," ")[:500])
              except Exception as e:
                  print("ERR",a.get("name"),repr(e))
              tested+=1
              if tested>=5: break
          PY
