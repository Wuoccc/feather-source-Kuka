name: Fix final numeric CJK app names
on:
  push:
    paths:
      - ".github/workflows/fix-numeric-cjk-names.yml"
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python tools/fix_numeric_cjk_names.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Fix final numeric CJK app names"
            git pull --rebase origin main
            git push origin main
          fi
