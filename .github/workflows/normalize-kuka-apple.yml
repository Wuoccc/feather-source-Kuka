name: Normalize Kuka app names from Apple

on:
  push:
    paths:
      - ".github/workflows/normalize-kuka-apple.yml"

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Normalize names using Apple storefronts
        run: |
          cat > /tmp/normalize_names.py <<'PY'
          import json, re, time, urllib.parse, urllib.request, hashlib, concurrent.futures, threading

          CJK = re.compile(r"[\u3400-\u9fff]")
          LATIN = re.compile(r"[A-Za-z]")
          UA = "Mozilla/5.0"
          lock = threading.Lock()

          VARIANTS = [
              "液态玻璃版","国服修改版","国服原版","国际版","国际服","多开版","多开",
              "资源包","修改版","破解版","解锁版","付费版","内购版","增强版","插件版",
              "汉化版","直装版","去广告版","免广告版","无限版","企业版","高级版","专业版"
          ]

          def http_json(url, retries=4):
              for i in range(retries):
                  try:
                      req = urllib.request.Request(url, headers={"User-Agent": UA})
                      with urllib.request.urlopen(req, timeout=20) as r:
                          return json.loads(r.read().decode("utf-8","replace"))
                  except Exception:
                      time.sleep(0.5 * (i + 1))
              return None

          def norm(s):
              s = str(s or "").lower()
              s = re.sub(r"[\s\-_:：·•.,，。!！?？'’\"“”()（）\[\]【】+]+", "", s)
              return s

          def cjk_chunks(s):
              return re.findall(r"[\u3400-\u9fff]{2,}", str(s or ""))

          def strip_variant(name):
              s = str(name or "").strip()
              for v in VARIANTS:
                  if s.endswith(v) and len(s) > len(v):
                      return s[:-len(v)].strip(" -—–_:："), v
              if s.lower().endswith("pro") and CJK.search(s[:-3]):
                  return s[:-3].strip(), "Pro"
              return s, None

          def score_candidate(query, cand, version=None):
              tn = str(cand.get("trackName") or "")
              qn, cn = norm(query), norm(tn)
              score = 0
              if qn and cn and qn == cn:
                  score += 140
              elif qn and cn and (qn in cn or cn in qn):
                  score += 95
              qchunks = cjk_chunks(query)
              tch = "".join(cjk_chunks(tn))
              if qchunks:
                  best = max((len(x) for x in qchunks if x and x in tch), default=0)
                  if best >= 4: score += 55
                  elif best >= 2: score += 30
              if version and str(cand.get("version") or "") == str(version):
                  score += 15
              return score

          def search_store(term, country, version=None):
              qs = urllib.parse.urlencode({
                  "term": term, "country": country, "media": "software", "entity": "software", "limit": 25
              })
              data = http_json("https://itunes.apple.com/search?" + qs)
              if not isinstance(data, dict):
                  return None
              best = None
              for cand in data.get("results") or []:
                  sc = score_candidate(term, cand, version)
                  if best is None or sc > best[0]:
                      best = (sc, cand)
              return best

          def lookup_bundle(bundle, country):
              qs = urllib.parse.urlencode({"bundleId": bundle, "country": country, "entity": "software"})
              data = http_json("https://itunes.apple.com/lookup?" + qs)
              if isinstance(data, dict) and data.get("results"):
                  return data["results"][0]
              return None

          def official_english_from_bundle(bundle, fallback=None):
              # VN first per source rules; then English-heavy storefronts.
              for country in ("vn","us","sg","gb","au","ca","hk"):
                  r = lookup_bundle(bundle, country)
                  if not r:
                      continue
                  n = str(r.get("trackName") or "").strip()
                  if n and LATIN.search(n) and not CJK.search(n):
                      return n, country
              if fallback:
                  n = str(fallback.get("trackName") or "").strip()
                  if n and LATIN.search(n) and not CJK.search(n):
                      return n, "search"
              return None, None

          def resolve_one(args):
              idx, original, version = args
              base, variant = strip_variant(original)
              # Search exact Chinese/base title. CN is useful for identifying the correct bundle;
              # VN is checked as a secondary identification route.
              best = None
              for country in ("cn","vn"):
                  r = search_store(base, country, version)
                  if r and (best is None or r[0] > best[0]):
                      best = (r[0], r[1], country)
              if not best or best[0] < 110:
                  return idx, original, None, None, best[0] if best else None, best[2] if best else None
              cand = best[1]
              bundle = cand.get("bundleId")
              if not bundle:
                  return idx, original, None, None, best[0], best[2]
              english, storefront = official_english_from_bundle(bundle, cand)
              if not english:
                  return idx, original, None, bundle, best[0], best[2]
              return idx, original, english, bundle, best[0], storefront

          # Fetch current live Kuka source for authoritative original names/order.
          live = http_json("https://app.ioskuka.com/appstore")
          if not isinstance(live, dict) or not isinstance(live.get("apps"), list):
              raise SystemExit("Failed to fetch live Kuka JSON")
          live_apps = [a for a in live["apps"] if a.get("name") != "‼️公告内容‼️"]

          with open("apps.json","r",encoding="utf-8") as f:
              data = json.load(f)
          apps = data.get("apps") or []
          if len(apps) != len(live_apps):
              raise SystemExit(f"Catalog count mismatch current={len(apps)} live={len(live_apps)}")

          targets = []
          for i, (app, src) in enumerate(zip(apps, live_apps)):
              original = str(src.get("name") or "").strip()
              if CJK.search(original):
                  targets.append((i, original, src.get("version")))

          resolved = {}
          with concurrent.futures.ThreadPoolExecutor(max_workers=10) as ex:
              for res in ex.map(resolve_one, targets):
                  idx, original, english, bundle, score, source = res
                  resolved[idx] = {
                      "original": original, "english": english, "bundle": bundle,
                      "score": score, "source": source
                  }

          changed = 0
          verified = 0
          reverted = 0
          examples = []
          for i, (app, src) in enumerate(zip(apps, live_apps)):
              original = str(src.get("name") or "").strip()
              old = str(app.get("name") or "")
              new = original
              if CJK.search(original):
                  r = resolved.get(i) or {}
                  english = str(r.get("english") or "").strip()
                  if english:
                      new = f"{english} ({original})"
                      verified += 1
                  elif old != original:
                      reverted += 1
              # For non-CJK Kuka names keep source name exactly.
              if new != old:
                  app["name"] = new
                  changed += 1
                  if len(examples) < 100:
                      examples.append({"index":i,"old":old,"new":new,"match":resolved.get(i)})

          # QA
          if not apps:
              raise SystemExit("apps empty")
          if any(not str(a.get("name") or "").strip() for a in apps):
              raise SystemExit("empty app name")
          # Ensure every CJK source name is either exact original or Official English (original).
          bad = []
          for i,(app,src) in enumerate(zip(apps,live_apps)):
              original = str(src.get("name") or "").strip()
              n = str(app.get("name") or "")
              if not CJK.search(original):
                  continue
              if n == original:
                  continue
              expected_suffix = f"({original})"
              prefix = n[:-len(expected_suffix)].strip() if n.endswith(expected_suffix) else ""
              if not (n.endswith(expected_suffix) and LATIN.search(prefix) and not CJK.search(prefix)):
                  bad.append({"index":i,"name":n,"original":original})
          if bad:
              raise SystemExit("Name QA failed: " + json.dumps(bad[:20], ensure_ascii=False))

          with open("apps.json","w",encoding="utf-8") as f:
              json.dump(data,f,ensure_ascii=False,indent=2)
              f.write("\n")
          with open(".name-normalization-audit.json","w",encoding="utf-8") as f:
              json.dump({
                  "catalog":len(apps),"cjkTargets":len(targets),"verifiedApple":verified,
                  "revertedToKuka":reverted,"changed":changed,"examples":examples
              },f,ensure_ascii=False,indent=2)
              f.write("\n")
          print(json.dumps({"catalog":len(apps),"cjkTargets":len(targets),"verifiedApple":verified,"revertedToKuka":reverted,"changed":changed},ensure_ascii=False))
          PY
          python /tmp/normalize_names.py
      - name: Commit normalized names
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps.json .name-normalization-audit.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Normalize Kuka app names against Apple"
            git push origin main
          fi
