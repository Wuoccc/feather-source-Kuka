name: Normalize Chinese app names

on:
  push:
    paths:
      - ".github/workflows/normalize-cn-app-names.yml"

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Normalize app names
        run: python tools/normalize_cn_app_names.py
      - name: Commit apps.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Normalize verified Chinese app names"
            git push origin main
          fi
