name: Normalize app names v4

on:
  push:
    paths:
      - ".github/workflows/normalize-names-v4.yml"

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Identity-safe Apple normalization
        run: python tools/normalize_names_v4.py
      - name: Commit normalized source and report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps.json .name-normalization-v4-report.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Normalize app names from Apple v4"
            git pull --rebase origin main
            git push origin main
          fi
