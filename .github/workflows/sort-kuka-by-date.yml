name: Sort Kuka apps by update date

on:
  push:
    paths:
      - ".github/workflows/sort-kuka-by-date.yml"

permissions:
  contents: write

jobs:
  sort:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Sort apps.json
        run: python tools/sort_apps_by_date.py
      - name: Commit apps.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Sort Kuka apps by update date"
            git push origin main
          fi
