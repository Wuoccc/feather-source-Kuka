name: Resolve remaining Chinese app names
on:
  push:
    paths:
      - ".github/workflows/resolve-apple-names.yml"
permissions:
  contents: write
jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Resolve names from Apple
        run: python tools/resolve_apple_names.py
      - name: Commit candidate results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apple_name_candidates.json apple_name_summary.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Resolve remaining Chinese app names"
            git push origin main
          fi
