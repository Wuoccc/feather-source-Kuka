name: Fast strict app-name rebuild
on:
  push:
    paths:
      - ".github/workflows/fast-rebuild-app-names.yml"
permissions:
  contents: write
jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python tools/fast_rebuild_app_names.py
      - name: QA and commit
        run: |
          python - <<'PY'
          import json
          d=json.load(open("apps.json",encoding="utf-8"))
          assert len(d.get("apps",[]))==2243
          assert all(str(a.get("name") or "").strip() for a in d["apps"])
          print("ok",len(d["apps"]))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps.json .name-normalization-summary-fast.json
          git commit -m "Normalize app names from verified Apple matches"
          git pull --rebase origin main
          git push origin main
