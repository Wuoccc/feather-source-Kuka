name: Build English aliases for remaining Chinese names
on:
  push:
    paths:
      - ".github/workflows/build-english-aliases.yml"
permissions:
  contents: write
jobs:
  aliases:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python tools/build_english_aliases.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add translated_name_aliases.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Build English aliases for Chinese app names"
            git push origin main
          fi
