name: Recover apps before v3

on:
  push:
    paths:
      - ".github/workflows/recover-pre-v3.yml"

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Restore apps.json from pre-v3 commit
        run: |
          git checkout b224f8df5bb578eac95f8a6cb6daf2e99754a7eb -- apps.json
          rm -f .name-normalization-v3-report.json
      - name: Commit recovery
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps.json
          git add -u .name-normalization-v3-report.json || true
          git commit -m "Recover apps before v3 index mismatch"
          git pull --rebase origin main
          git push origin main
