name: Verify Feather downloadable IPAs

on:
  push:
    paths:
      - ".github/workflows/verify-downloadable-ipas.yml"

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Verify package bytes and prepare filtered source
        run: |
          python - <<'PY'
          import json, re, urllib.request, urllib.error
          from pathlib import Path

          p=Path("apps.json")
          data=json.loads(p.read_text(encoding="utf-8"))
          apps=data.get("apps") or []
          results=[]
          keep=[]

          def verify(url):
              req=urllib.request.Request(
                  url,
                  headers={
                      "User-Agent":"Mozilla/5.0",
                      "Range":"bytes=0-4095",
                      "Accept":"*/*",
                  }
              )
              try:
                  with urllib.request.urlopen(req,timeout=30) as r:
                      body=r.read(4096)
                      ctype=str(r.headers.get("content-type") or "")
                      final=r.geturl()
                      # IPA/TIPA are ZIP containers. ZIP local file header = PK\x03\x04.
                      is_zip=body.startswith(b"PK\x03\x04") or body.startswith(b"PK\x05\x06") or body.startswith(b"PK\x07\x08")
                      return {
                          "ok": bool(is_zip),
                          "status": getattr(r,"status",None),
                          "contentType": ctype,
                          "contentLength": r.headers.get("content-length"),
                          "finalURL": final,
                          "prefixHex": body[:16].hex(),
                          "textPrefix": body[:300].decode("utf-8","replace") if not is_zip else None,
                      }
              except Exception as e:
                  return {"ok":False,"error":f"{type(e).__name__}: {e}"}

          for i,a in enumerate(apps):
              urls=[]
              u=str(a.get("downloadURL") or "").strip()
              if u and re.search(r"\.(ipa|tipa)(?:$|[?#])",u,re.I):
                  urls.append(("app",u))
              for vi,v in enumerate(a.get("versions") or []):
                  vu=str((v or {}).get("downloadURL") or "").strip()
                  if vu and re.search(r"\.(ipa|tipa)(?:$|[?#])",vu,re.I):
                      urls.append((f"version:{vi}",vu))
              # de-duplicate URLs
              seen=set(); checked=[]
              for where,url in urls:
                  if url in seen: continue
                  seen.add(url)
                  vr=verify(url)
                  checked.append({"where":where,"url":url,**vr})
              good=[x for x in checked if x.get("ok")]
              if good:
                  keep.append(a)
              if checked:
                  results.append({"index":i,"name":a.get("name"),"checked":checked,"kept":bool(good)})

          audit={
              "catalogApps":len(apps),
              "appsWithIpaTipaURL":len(results),
              "verifiedDownloadable":len(keep),
              "rejected":len(results)-len(keep),
              "results":results,
          }
          Path(".downloadable-ipa-audit.json").write_text(json.dumps(audit,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")

          if keep:
              data["apps"]=keep
              data["name"]="Kuka Source for Feather - Downloadable IPA Only"
              data["subtitle"]=f"Verified downloadable IPA/TIPA only: {len(keep)} apps"
              p.write_text(json.dumps(data,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
              print("FILTERED",len(keep))
          else:
              print("FILTERED_ZERO - apps.json left unchanged to avoid an invalid empty Feather source")
          PY
      - name: Commit audit and filtered source when available
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps.json .downloadable-ipa-audit.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Filter Feather source to verified downloadable IPAs"
            git push origin main
          fi
