name: Kuka live check

on:
  push:
    paths:
      - ".github/workflows/kuka-live-check.yml"

permissions:
  contents: write

jobs:
  check:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch Kuka live summary
        run: |
          python - <<'PY'
          import json, urllib.request, datetime
          url = "https://app.ioskuka.com/appstore"
          req = urllib.request.Request(url, headers={"User-Agent":"Mozilla/5.0"})
          with urllib.request.urlopen(req, timeout=60) as r:
              raw = r.read()
          data = json.loads(raw)
          apps = data.get("apps") or []
          keys = ["name","version","versionDate","date","size","downloadURL","lock","iconURL","localizedDescription","versionDescription","subtitle","bundleIdentifier"]
          sample = []
          for a in apps[:40]:
              sample.append({k:a.get(k) for k in keys if k in a})
          out = {
              "checkedAt": datetime.datetime.now(datetime.timezone.utc).isoformat(),
              "count": len(apps),
              "sourceKeys": sorted(data.keys()),
              "sourceName": data.get("name"),
              "sourceIdentifier": data.get("identifier"),
              "sourceIcon": data.get("sourceicon") or data.get("iconURL"),
              "latest40": sample,
          }
          with open(".kuka-live-check.json","w",encoding="utf-8") as f:
              json.dump(out,f,ensure_ascii=False,indent=2)
              f.write("\n")
          PY
      - name: Commit live summary
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .kuka-live-check.json
          git commit -m "Temporary Kuka live check" || exit 0
          git push
