name: Kuka live check

on:
  push:
    paths:
      - ".github/workflows/kuka-live-check.yml"

permissions:
  contents: write

jobs:
  check:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare Kuka live with current source
        run: |
          python - <<'PY'
          import json, urllib.request, datetime
          def dt(s):
              if not s: return None
              try: return datetime.datetime.fromisoformat(str(s).replace("Z","+00:00"))
              except: return None
          with open("apps.json","r",encoding="utf-8") as f:
              cur=json.load(f)
          url="https://app.ioskuka.com/appstore"
          req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0"})
          with urllib.request.urlopen(req,timeout=60) as r:
              live=json.loads(r.read())
          live_apps=[a for a in (live.get("apps") or []) if a.get("name")!="‼️公告内容‼️"]
          cur_apps=cur.get("apps") or []
          live_dates=[(dt(a.get("versionDate")),a.get("name"),a.get("version"),a.get("versionDate")) for a in live_apps if dt(a.get("versionDate"))]
          cur_dates=[(dt(a.get("versionDate")),a.get("name"),a.get("version"),a.get("versionDate")) for a in cur_apps if dt(a.get("versionDate"))]
          live_dates.sort(reverse=True,key=lambda x:x[0])
          cur_dates.sort(reverse=True,key=lambda x:x[0])
          out={
            "checkedAt":datetime.datetime.now(datetime.timezone.utc).isoformat(),
            "liveTotalIncludingAnnouncement":len(live.get("apps") or []),
            "liveAppsExcludingAnnouncement":len(live_apps),
            "currentApps":len(cur_apps),
            "liveLatest20":[{"name":n,"version":v,"versionDate":s} for _,n,v,s in live_dates[:20]],
            "currentLatest20":[{"name":n,"version":v,"versionDate":s} for _,n,v,s in cur_dates[:20]],
          }
          with open(".kuka-live-check.json","w",encoding="utf-8") as f:
              json.dump(out,f,ensure_ascii=False,indent=2); f.write("\n")
          PY
      - name: Commit comparison
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .kuka-live-check.json
          git commit -m "Temporary Kuka live comparison" || exit 0
          git push
