name: Apply full Chinese app name normalization
on:
  push:
    paths:
      - "apple_name_candidates.json"
      - "fast_apple_candidates.json"
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Apply verified and fallback English aliases
        run: python tools/apply_full_name_normalization.py
      - name: Commit normalized apps.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps.json name_normalization_report.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Normalize all remaining Chinese app names"
            git push origin main
          fi
