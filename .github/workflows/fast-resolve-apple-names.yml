name: Fast resolve Chinese names from Apple
on:
  push:
    paths:
      - ".github/workflows/fast-resolve-apple-names.yml"
permissions:
  contents: write
jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python tools/fast_resolve_apple_names.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fast_apple_candidates.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Fast resolve Chinese app names from Apple"
            git pull --rebase origin main
            git push origin main
          fi
